<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feelime 键盘预览（真实键盘文件 + 空操作桥）</title>
<!--
  固化在仓库里的键盘预览工具（键盘外观变更 demo-first 流程
  的落地载体，见 AGENTS.md「键盘外观变更流程」）。

  它不复制任何键盘代码：启动时 fetch 真实的
  app/src/main/assets/keyboard/{index.html, keyboard.css, keyboard.js}，
  把 FeelimeNative 桥替换成「空操作 + 调用日志 + 假引擎」后内联加载。
  键盘的行为、外观与真机完全同源，改键盘源文件后刷新本页即可见效。

  用法：
    cd <仓库根>
    python3 -m http.server 8770
    # 浏览器打开 http://<host>:8770/tools/keyboard-preview.html
    # Chrome F12 开启设备模拟（手机模式）后可像手机一样触摸操作。

  横屏 / 键盘高度调节在真机由原生侧驱动（orientation 随 bridge hello
  下发、IME 视图高度由 FeelimeService 裁剪）；本页用「设备尺寸」按钮
  改变 iframe 视口触发同样的 resize 路径来演示。
-->
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #101114; color: #e6e7ec;
  font-family: system-ui, "Noto Sans CJK SC", sans-serif; }
body { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
#toolbar {
  flex: 0 0 auto;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 8px 10px; background: #1b1d22; border-bottom: 1px solid #2a2d34;
  font-size: 12.5px;
}
#toolbar b { font-size: 13px; margin-right: 4px; }
#toolbar button, #toolbar select, #toolbar a {
  border: 1px solid #3a3e48; border-radius: 7px; background: #262932;
  color: #e6e7ec; font-size: 12px; padding: 4px 10px; cursor: pointer; text-decoration: none;
}
#toolbar button.active { background: #23c890; border-color: #23c890; color: #07180e; font-weight: 600; }
#toolbar .dim { color: #9aa0ab; }
#stageWrap { position: relative; flex: 1 1 0; min-height: 0; overflow: hidden; display: flex;
  justify-content: center; background:
  repeating-conic-gradient(#14161a 0% 25%, #101114 0% 50%) 50% / 24px 24px; }
#stage { position: relative; background: #000; overflow: hidden;
  border-left: 1px solid #2a2d34; border-right: 1px solid #2a2d34;
  box-shadow: 0 0 40px #000c; }
#kb-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
#logDrawer {
  position: fixed; right: 10px; top: 55px; width: 330px; max-height: 70vh;
  overflow-y: auto; background: #16181dd9; border: 1px solid #2a2d34;
  border-radius: 10px; padding: 8px 10px; font-size: 11.5px; z-index: 50;
  backdrop-filter: blur(4px); display: none;
}
#logDrawer.open { display: block; }
#logDrawer h4 { margin: 0 0 6px; font-size: 12px; color: #9aa0ab; }
#logDrawer .entry { padding: 2px 0; border-bottom: 1px dashed #24262c; word-break: break-all; }
#logDrawer .entry b { color: #23c890; }
#logDrawer .dim { color: #7c8290; }
/* ---- 验收清单：勾选/描述/生成汇总 ---- */
#checkDrawer {
  position: fixed; left: 10px; top: 55px; width: min(420px, calc(100vw - 20px));
  max-height: 80vh; overflow-y: auto; background: #16181deF; border: 1px solid #2a2d34;
  border-radius: 10px; padding: 10px 12px; font-size: 12.5px; z-index: 60;
  backdrop-filter: blur(4px); display: none;
}
#checkDrawer.open { display: block; }
#checkDrawer h4 { margin: 0 0 8px; font-size: 12.5px; }
#checkDrawer .dim { color: #9aa0ab; font-weight: 400; }
.check-item { display: flex; align-items: flex-start; gap: 8px; padding: 3px 0; }
.check-item button {
  flex: none; width: 30px; height: 26px; border: 1px solid #3a3e48; border-radius: 6px;
  background: #262932; color: #9aa0ab; font-size: 13px; cursor: pointer;
}
.check-item button.ok { background: #23c890; border-color: #23c890; color: #07180e; font-weight: 700; }
.check-item button.bad { background: #7a2430; border-color: #ff6b6b; color: #ffd8dc; font-weight: 700; }
.check-item input {
  flex: 1; min-width: 0; border: 1px solid #3a3e48; border-radius: 6px; background: #101114;
  color: #e6e7ec; font-size: 12.5px; padding: 5px 8px; display: none;
}
.check-item.bad input { display: block; }
.check-item span.label { flex: 1; padding-top: 4px; }
#checkGen, #checkCopy {
  margin-top: 8px; border: 0; border-radius: 7px; background: #23c890; color: #07180e;
  font-size: 13px; font-weight: 600; padding: 9px 16px; cursor: pointer;
}
#checkCopy { background: #262932; color: #e6e7ec; }
#checkOut { margin-top: 8px; }
#checkText {
  width: 100%; box-sizing: border-box; background: #101114; color: #e6e7ec;
  border: 1px solid #3a3e48; border-radius: 7px; font-size: 12px; padding: 8px;
}
</style>
</head>
<body>
<div id="toolbar">
  <b>Feelime 0.17.6 开发预览</b>
  <span class="dim">设备</span>

</div>
<div id="stageWrap"><div id="stage"><iframe id="kb-frame"></iframe></div></div>
<div id="logDrawer"><h4>FeelimeNative 调用日志（空操作）</h4><div id="logBody"></div></div>
<div id="checkDrawer">
  <h4>验收清单 <span class="dim">（没问题打 ✓；有问题打 ✗ 并写一句描述）</span></h4>
  <div id="checkList"></div>
  <div id="checkOut" hidden>
    <textarea id="checkText" rows="8" readonly></textarea>
    <button id="checkCopy">复制结果</button>
  </div>
  <button id="checkGen">生成验收结果</button>

<script>
'use strict';
// 每次打开都换 fetch 时间戳：手机浏览器对键盘文件的强缓存不再生效。
document.documentElement.dataset.deployStamp = String(Date.now());
const MODES = {
    portrait: { w: 390, h: 844 },
    // A real landscape short edge is ~411css (1080物理/2.625); 390
    // starved the keyboard below its content floor (206 < 195+11) and the
    // height thumb read as "below minimum" - a preview-only artifact.
    landscape: { w: 844, h: 411 },
};
const frame = document.getElementById('kb-frame');
const previewSafeBottom = Math.max(0, Math.min(96,
    Number(new URLSearchParams(location.search).get('safeBottom')) || 0));
const stage = document.getElementById('stage');
const logBody = document.getElementById('logBody');
const entries = [];
let keyboardMode = 'pinyin'; // 假引擎当前键盘（桥 hello 下发）
// 快捷设置方块的回读状态（真机由原生偏好下发；setQuickPref 在这里
// 模拟落盘并重推 hello，方块状态即可回读）。
let previewPrefs = { associationOn: true, keySound: false, keyHaptic: false,
    candidateFont: 0, holdMs: 350, popupSnap: 1, dpScheme: 'ziranma',
    oneHand: 0, sideContent: 0, uiLanguage: 'zh' };

function log(method, detail) {
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = '<b>' + method + '</b> ' + (detail || '');
    logBody.prepend(div);
    entries.push(div);
    while (entries.length > 120) entries.shift().remove();
}

const esc = v => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;');

/* ---- 假引擎：让候选条 / composing 工具栏可以在页面上走通 ---- */
const FAKE_CANDS = {
    nihao: ['你好', '你号', '拟好', '妮号', '你豪', '泥嚎'],
    ni: ['你', '妮', '拟', '逆', '腻'],
    nih: ['你哈', '拟化'],
    niha: ['你哈'],
    hao: ['好', '号', '耗'],
    a: ['啊', '阿'],
    zh: ['这', '着'],
    'z': ['在', '再'],
};
let rawInput = '';
let revision = 0;
let deletedHead = null; // 删除自造词后的假引擎状态


function pushEngineState(raw, composing) {
    revision += 1;
    if (raw !== rawInput) deletedHead = null;
    let candidates = composing
        ? fakeCandidates(raw).map((text, i) => ({ id: 'c' + revision + '-' + i, text }))
        : [];
    if (deletedHead) candidates = candidates.filter(c => c.text !== deletedHead);
    frame.contentWindow.Feelime.onEngineState({
        phase: 'READY',
        revision,
        mode: keyboardMode,
        composing: composing ? (raw || ' ') : '',
        rawInput: raw,
        candidates,
        hasNextPage: false,
    });
    hostRender(composing ? raw : '');
}

/** 键盘视图高度变化后让 keyboard.js 重算行高（view resize 不触发 window
 * resize，手动踢一下）。 */
function pushEngineRefresh() {
    const win = frame.contentWindow;
    if (win && typeof win.dispatchEvent === 'function') {
        win.dispatchEvent(new win.Event('resize'));
    }
}

/* ---- 假引擎（双拼 / 法语）：自然码键位 → 全拼后查表；法语给音标词 ---- */
const DOUBLE_INITIALS = { v: 'zh', i: 'ch', u: 'sh' };
const DOUBLE_FINALS = {
    q: ['iu'], w: ['ua', 'ia'], e: ['e'], r: ['uan', 'er'], t: ['ue', 've'],
    y: ['ing', 'uai'], u: ['u'], i: ['i'], o: ['o', 'uo'], p: ['un'],
    a: ['a'], s: ['ong', 'iong'], d: ['iang', 'uang'], f: ['en'], g: ['eng'],
    h: ['ang'], j: ['an'], k: ['ao'], l: ['ai'],
    z: ['ei'], x: ['ie'], c: ['iao'], v: ['ui', 'ü'], b: ['ou'], n: ['in'], m: ['ian'],
};
const PINYIN_WORDS = {
    zhang: ['张', '章', '涨'], chang: ['长', '常', '唱'], shang: ['上', '商', '伤'],
    zhou: ['周', '州', '粥'], chou: ['抽', '仇'], shou: ['手', '收', '首'],
    xian: ['先', '西安', '县'], wang: ['王', '往', '网'], zhai: ['宅', '摘'],
    chuan: ['船', '传'], shuo: ['说', '硕'], dui: ['对', '队'],
};
const FRENCH_WORDS = ['café', 'très', 'après', 'français', 'être', 'père', 'déjà', 'où'];

function doublePinyinToPinyin(raw) {
    // 零声母（a/e/o 开头）直接按全拼处理。
    const keys = raw.replace(/'/g, '').replace(/ /g, '');
    const out = [];
    for (let i = 0; i < keys.length; i += 2) {
        const s = keys[i];
        const f = keys[i + 1] || '';
        if (['a', 'e', 'o'].includes(s)) { out.push(s + f); continue; }
        const initial = DOUBLE_INITIALS[s] || s;
        const finals = DOUBLE_FINALS[f];
        if (!finals) return [keys];
        out.push(...finals.map(fin => initial + fin));
    }
    return [...new Set(out)];
}

function fakeCandidates(raw) {
    // Preview data only: production candidates always come from Rime.
    const partial = { "x'an": ['西安', '相安', '心安'], "xi'an": ['西安'],
        "xiang'an": ['相安', '相安无事'], "xin'an": ['心安', '新安'],
        "c'shi": ['测试', '城市', '擦拭'], "ca'shi": ['擦拭', '擦试'],
        "cai'shi": ['才是', '菜市', '采石'], cashi: ['擦拭', '擦试'] };
    if (keyboardMode === 'pinyin' && partial[raw]) return partial[raw].slice();
    const key = raw.replace(/ /g, '').replace(/'/g, '');
    const table = FAKE_CANDS[key];
    if (table) return table.slice();
    if (keyboardMode === 'double-pinyin') {
        const all = [];
        doublePinyinToPinyin(raw).forEach(py => {
            if (PINYIN_WORDS[py]) all.push(...PINYIN_WORDS[py]);
            else if (FAKE_CANDS[py]) all.push(...FAKE_CANDS[py]);
        });
        if (all.length) return [...new Set(all)];
        return [key + '（双拼占位）'];
    }
    if (keyboardMode === 'french') {
        const hits = FRENCH_WORDS.filter(w => w.normalize('NFD').startsWith(key.normalize('NFD').slice(0, 2)));
        return hits.length ? hits : [key + '…'];
    }
    if (keyboardMode === 'japanese') return ['こんにちは', 'コンニチハ', key + '（占位）'];
    if (!raw) return [];
    return [raw + '（占位）', raw + '2', raw + '3'];
}

/* ---- 宿主编辑器：展示输入效果（预览专用） ---- */
let hostCommitted = '';
let voiceLevelTimer = 0;
let voicePartial = '';
let voiceSegments = 0;
/* 面板演示数据（预览工具专用）：剪贴板/常用语在内存里维护，桥调用
 * 后像真机原生一样异步回推 onClipboard/onFavorites，否则面板永远空白。 */
let panelClip = [
    { id: 'c1', text: 'meeting 3pm, room 402', time: Date.now() - 600e3 },
    { id: 'c2', text: '这个需求周五前要上线', time: Date.now() - 3600e3 },
    { id: 'c3', text: 'https://example.com/pr/123', time: Date.now() - 86400e3 },
];
let favSeq = 3;
let panelFav = [
    { id: 'f1', text: '麻烦确认一下，谢谢', code: '', time: Date.now() - 86400e3 },
    { id: 'f2', text: '稍等，我看下', code: 'sd', time: Date.now() - 86400e3 * 2 },
    { id: 'f3', text: '收到', code: '', time: Date.now() - 86400e3 * 3 },
];
function pushPanelData(callback, payload) {
    const win = frame.contentWindow;
    if (!win || !win.Feelime || !win.Feelime[callback]) return;
    setTimeout(() => win.Feelime[callback](payload), 120);
}
function hostRender(raw) {
    const el = frame.contentDocument && frame.contentDocument.getElementById('hostEditor');
    if (!el) return;
    el.innerHTML =
        '<span class="host-done">' + esc(hostCommitted).replace(/\n/g, '<br>') + '</span>' +
        '<span class="host-caret"></span>' +
        '<span class="host-raw">' + esc(raw || '') + '</span>';
    el.scrollTop = el.scrollHeight;
}
function hostCommit(text) { hostCommitted += text; hostRender(rawInput); }
function hostBackspace() {
    if (rawInput) return;
    hostCommitted = hostCommitted.replace(/[\s\S]$/u, '');
    hostRender('');
}

/* ---- 空操作桥：记录每一次调用，输入键喂给假引擎 ---- */
function makeBridge() {
    const bridgeTable = {
        keyboardReady(version, minApi, caps) {
            log('keyboardReady', `键盘 ${esc(version)}，能力 <code>${esc(caps)}</code>`);
        },
        requestState() {
            setTimeout(pushHello, 0);
        },
        key(char) {
            const viaEngine = keyboardMode.includes('pinyin');
            log('key', esc(char) + (viaEngine ? ' <span class="dim">→ 引擎</span>' : ''));
            if (viaEngine && /[a-z']/.test(char)) {
                rawInput += char;
                pushEngineState(rawInput, true);
            } else if (!viaEngine) {
                // 英文/法/日直通模式：引擎直接上屏（模拟原生行为）。
                hostCommit(char);
            }
        },
        setComposition(keys) {
            log('setComposition', esc(keys));
            // Match native Reset + per-key engine echoes. A final-only fake
            // hid the disappearing spelling column during repeated choices.
            rawInput = '';
            pushEngineState('', false);
            for (const key of keys) {
                rawInput += key;
                pushEngineState(rawInput, true);
            }
        },
        space() {
            log('space', '<span class="dim">空格上屏</span>');
            hostCommit(rawInput ? '' : ' ');
            rawInput = '';
            pushEngineState('', false);
        },
        backspace() {
            log('backspace', '');
            if (!rawInput) hostBackspace();
            rawInput = rawInput.slice(0, -1);
            pushEngineState(rawInput, rawInput.length > 0);
        },
        enter() {
            log('enter', '');
            hostCommitted += '\n';
            rawInput = '';
            pushEngineState('', false);
        },
        moveCursor(delta) { log('moveCursor', (delta > 0 ? '+' : '') + delta); },
        setKeyboardHeight(cssPx) {
            log('setKeyboardHeight', cssPx + 'css px <span class="dim">→ 视图整体变高/变矮</span>');
            const kb = frame.contentDocument && frame.contentDocument.getElementById('softKeyboard');
            const landscape = frame.clientWidth > frame.clientHeight;
            const defaultHeight = Math.min(272, Math.round(frame.clientHeight * (landscape ? 0.5 : 0.45)));
            if (kb) kb.style.height = ((Number(cssPx) || defaultHeight) + previewSafeBottom) + 'px';
            setTimeout(pushEngineRefresh, 0);
        },
        keyEvent(keyCode, metaState) {
            const names = { 111: 'Esc', 61: 'Tab', 122: 'Home', 123: 'End',
                92: 'PgUp', 93: 'PgDn', 19: '↑', 20: '↓', 21: '←', 22: '→',
                112: 'Del', 56: '.', 131: 'F4' };
            const name = /^[A-Z]$/.test(String.fromCharCode(65 + keyCode - 29))
                ? String.fromCharCode(65 + keyCode - 29) : (names[keyCode] || '#' + keyCode);
            const mods = [
                (metaState & 0x1000) && 'Ctrl',
                (metaState & 2) && 'Alt',
                (metaState & 1) && 'Shift',
                (metaState & 0x10000) && 'Meta',
            ].filter(Boolean).join('+');
            log('keyEvent', `<b>${mods ? mods + '+' : ''}${name}</b> <span class="dim">→ 宿主编辑器</span>`);
        },
        chooseCandidate(rev, id) {
            log('chooseCandidate', `rev=${rev} id=${esc(id)}`);
            const cands = fakeCandidates(rawInput);
            hostCommit(cands[0] || '');
            rawInput = '';
            pushEngineState('', false);
        },
        deleteHighlightedCandidate() {
            // 模拟 librime 删自造词 —— 假引擎里首个候选必删成功。
            log('deleteHighlightedCandidate', '<span class="dim">→ 候选池重建</span>');
            const head = fakeCandidates(rawInput)[0];
            if (head) deletedHead = head;
            pushEngineState(rawInput, true);
        },
        deleteCandidate(rev, id) {
            // 任意候选删除（假引擎按 id 定位）。
            log('deleteCandidate', `rev=${rev} id=${esc(id)} <span class="dim">→ 候选池重建</span>`);
            const cands = fakeCandidates(rawInput);
            const hit = cands.find((t, i) => 'c' + revision + '-' + i === id);
            if (hit) deletedHead = hit;
            pushEngineState(rawInput, true);
        },
        pageNext(rev) { log('pageNext', 'rev=' + rev); },
        pagePrevious(rev) { log('pagePrevious', 'rev=' + rev); },
        // 手写识别（issue #28）：延时回固定候选，演示书写→候选条→点选
        // 上屏全链路（真机由 PP-OCRv5 引擎回推）。
        recognizeInk(reqId, payload, token) {
            let strokes = 0;
            try { strokes = (JSON.parse(payload).strokes || []).length; } catch (_) {}
            log('recognizeInk', `req=${reqId} strokes=${strokes} <span class="dim">→ 模拟识别</span>`);
            const win = frame.contentWindow;
            setTimeout(() => {
                if (!win || !win.Feelime) return;
                win.Feelime.onInkCandidates({
                    reqId,
                    candidates: [
                        { text: '感', score: 0.62 }, { text: '憾', score: 0.14 },
                        { text: '城', score: 0.09 }, { text: '成', score: 0.06 },
                        { text: '诚', score: 0.04 }, { text: '盛', score: 0.03 },
                        { text: '晟', score: 0.012 }, { text: '咸', score: 0.008 },
                    ],
                    error: null,
                });
            }, 300);
        },
        selectMode(mode) {
            log('selectMode', esc(mode) + ' <span class="dim">→ 重推 hello（真机原生行为）</span>');
            keyboardMode = mode;
            rawInput = '';
            pushEngineState('', false);
            // 真机上 selectMode 后原生会重新 pushBridgeHello 驱动重渲染。
            setTimeout(pushHello, 0);
        },
        startVoice() {
            log('startVoice', '<span class="dim">→ 模拟录音浮层</span>');
            voiceLevelTimer = setInterval(() => {
                const win = frame.contentWindow;
                if (!win || !win.Feelime) return;
                win.Feelime.onNativeState({
                    state: 'listening',
                    level: 0.25 + Math.abs(Math.sin(Date.now() / 300)) * 0.7,
                    partial: voicePartial,
                });
                // 每 ~2.5s 假装识别出一段。
                if (Math.random() < 0.25) {
                    voicePartial = '模拟识别' + (voiceSegments += 1);
                    win.Feelime.onNativeState({ state: 'listening', level: 0.5, partial: voicePartial });
                }
            }, 300);
            const win = frame.contentWindow;
            win && win.Feelime && win.Feelime.onNativeState({ state: 'loading', level: 0 });
            setTimeout(() => {
                const w = frame.contentWindow;
                w && w.Feelime && w.Feelime.onNativeState({ state: 'listening', level: 0.4, partial: voicePartial });
            }, 400);
        },
        stopVoice() {
            log('stopVoice', '');
            if (voiceLevelTimer) { clearInterval(voiceLevelTimer); voiceLevelTimer = 0; }
            const win = frame.contentWindow;
            if (!win || !win.Feelime) return;
            win.Feelime.onNativeState({ state: 'idle', level: 0 });
            if (voicePartial) {
                hostCommit(voicePartial);
                voicePartial = '';
                voiceSegments = 0;
                hostRender(rawInput);
            }
        },
        cancelVoice() {
            log('cancelVoice', '<span class="dim">→ 丢弃本次识别</span>');
            if (voiceLevelTimer) { clearInterval(voiceLevelTimer); voiceLevelTimer = 0; }
            voicePartial = '';
            voiceSegments = 0;
            const win = frame.contentWindow;
            if (win && win.Feelime) win.Feelime.onNativeState({ state: 'idle', level: 0, partial: '' });
            hostRender(rawInput);
        },
        switchInputMethod() { log('switchInputMethod', '<span class="dim">→ 系统 IME picker</span>'); },
        hideKeyboard() { log('hideKeyboard', ''); },
        openSetup() { log('openSetup', ''); },
        setQuickPref(key, value) {
            log('setQuickPref', `${esc(String(key))}=${esc(String(value))} <span class="dim">→ 重推 hello</span>`);
            if (key === 'uiLocale') {
                // 原生 UiLanguage 落盘：hello 带回选择值 + 解析后的 locale。
                previewPrefs.uiLanguage = value;
                document.getElementById('previewLocale').value = value === 'auto' ? 'zh' : value;
                setTimeout(pushHello, 0);
                return;
            }
            const map = { association: 'associationOn', keySound: 'keySound',
                keyHaptic: 'keyHaptic', candidateFont: 'candidateFont',
                oneHand: 'oneHand', sideContent: 'sideContent',
                holdMs: 'holdMs', popupSnap: 'popupSnap', dpScheme: 'dpScheme' };
            const slot = map[key];
            if (!slot) return;
            previewPrefs[slot] = value === '1' || value === '0'
                ? value === '1'
                : (Number.isNaN(Number(value)) ? value : Number(value));
            setTimeout(pushHello, 0);
        },
        reloadKeyboard() { log('reloadKeyboard', ''); },
        commitText(text) {
            log('commitText', esc(text));
            hostCommit(text);
        },
        panelFlush(session) { frame.contentWindow.Feelime.onPanelFlushed({session}); },
        panelSelection(start, end, session) { log('panelSelection', `${start}, ${end}, ${session}`); },
        panelInput(active) { log('panelInput', String(active)); },
        getClipboard() {
            log('getClipboard', '<span class="dim">→ 回推演示数据</span>');
            pushPanelData('onClipboard', { items: panelClip });
        },
        clearClipboard() {
            log('clearClipboard', '');
            panelClip = [];
            pushPanelData('onClipboard', { items: [] });
        },
        removeClipboard(id) {
            log('removeClipboard', esc(id));
            panelClip = panelClip.filter(i => i.id !== String(id));
            pushPanelData('onClipboard', { items: panelClip });
        },
        getFavorites() {
            log('getFavorites', '<span class="dim">→ 回推演示数据</span>');
            pushPanelData('onFavorites', { items: panelFav });
        },
        favoritesAdd(text, code) {
            log('favoritesAdd', esc(text) + ' ' + esc(code || ''));
            panelFav.unshift({ id: 'f' + (++favSeq), text: String(text),
                code: String(code || ''), time: Date.now() });
            pushPanelData('onFavorites', { items: panelFav });
        },
        favoritesUpdate(id, text, code) {
            log('favoritesUpdate', esc(id) + ' ' + esc(text) + ' ' + esc(code || ''));
            const hit = panelFav.find(i => i.id === String(id));
            if (hit) { hit.text = String(text); hit.code = String(code || ''); }
            pushPanelData('onFavorites', { items: panelFav });
        },
        favoritesRemove(id) {
            log('favoritesRemove', esc(id));
            panelFav = panelFav.filter(i => i.id !== String(id));
            pushPanelData('onFavorites', { items: panelFav });
        },
        favoritesMove(id, to) {
            log('favoritesMove', esc(id) + ' → ' + esc(to));
            const from = panelFav.findIndex(i => i.id === String(id));
            if (from >= 0) {
                const [row] = panelFav.splice(from, 1);
                panelFav.splice(Number(to) || 0, 0, row);
            }
            pushPanelData('onFavorites', { items: panelFav });
        },
    };
    // 未实现的方法一律记录（避免静默丢调用）。
    return new Proxy(bridgeTable, {
        get(target, prop) {
            if (prop in target) return target[prop];
            return (...args) => log(String(prop), esc(args.join(', ')));
        },
    });
}

function pushHello() {
    const win = frame.contentWindow;
    if (!win || !win.Feelime) return;
    const landscape = frame.clientWidth > frame.clientHeight;
    // The keyboard requires favorites-v2 (exact arg order) - a stale v1
    // here made onBridgeHello bail and EVERYTHING hello
    // carries (ready gate, floatBand, heightCeil) silently fell back.
    const caps = ['candidate-revision-v1', 'clipboard-v1', 'commit-text-v1',
        'compose-control-v1', 'unicode-compose-v1', 'cursor-repeat-v1', 'cursor-delta-v1', 'panel-compose-v1', 'favorites-v2', 'ime-control-v1',
        'key-event-v1', 'keyboard-height-reset-v1', 'keyboard-update-status-v1', 'text-input-v1', 'voice-session-v1', 'voice-cancel-v1'];
    win.Feelime.onBridgeHello({
        nativeApiVersion: 1,
        capabilities: caps,
        uiLocale: document.getElementById('previewLocale').value,
        theme: document.getElementById('previewTheme').value !== 'auto'
            ? document.getElementById('previewTheme').value
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light' : 'dark',
        orientation: landscape ? 'landscape' : 'portrait',
        // 手势条避让（真机由原生下发 px；预览默认 0）。
        safeBottom: previewSafeBottom,
        // 键盘手感/留白（真机由 hello 下发；预览用上面的控件演示）。
        bottomPad: Number(document.getElementById('previewBottomPad').value) || 0,
        // Match native floatBandPx: landscape 30%, portrait 40%, capped at 200dp.
        floatBand: Math.min(200, Math.floor(frame.clientHeight * (landscape ? 0.3 : 0.4))),
        // Height-card drag range, same semantics as the native clamp
        // (portrait 45% of the frame height / landscape half) so the preview
        // thumb starts where the device's would.
        heightDefault: Math.min(272, Math.round(frame.clientHeight * (landscape ? 0.5 : 0.45))),
        heightFloor: landscape ? 170 : 210,
        heightCeil: Math.round(frame.clientHeight * (landscape ? 0.5 : 0.45)),
        pageGenerationToken: 'tok-1',
        mode: keyboardMode,
        engineDataReady: { pinyin: true, 'double-pinyin': true, japanese: true,
            french: true, russian: true, t9: true, stroke: true, handwriting: true },
        // 键盘侧偏好（真机由原生 hello 下发；值同 previewPrefs）。
        uiLanguage: previewPrefs.uiLanguage,
        associationOn: previewPrefs.associationOn,
        keySound: previewPrefs.keySound,
        keyHaptic: previewPrefs.keyHaptic,
        candidateFont: previewPrefs.candidateFont,
        oneHand: previewPrefs.oneHand,
        sideContent: previewPrefs.sideContent,
        holdMs: previewPrefs.holdMs,
        popupSnap: previewPrefs.popupSnap,
        dpScheme: previewPrefs.dpScheme,
    });
}

/* ---- 组装 iframe 文档：真实 index.html + 内联 CSS/JS + 注入桥 ---- */
async function fetchFirst(file) {
    // 仓库内 http server 与 nginx share 部署两种布局都支持。
    // cache-bust：手机浏览器会强缓存键盘文件，不带时间戳会一直跑旧版。
    const bust = '?t=' + document.documentElement.dataset.deployStamp;
    for (const root of ['../app/src/main/assets/keyboard/', 'kb-preview-src/']) {
        const r = await fetch(root + file + bust, { cache: 'no-store' });
        if (r.ok) return await r.text();
    }
    throw new Error('找不到 ' + file + '（需从仓库根起 http server，或部署 kb-preview-src/ 目录）');
}

async function build() {
    const [html, css, js] = await Promise.all([
        fetchFirst('index.html'),
        fetchFirst('keyboard.css'),
        fetchFirst('keyboard.js'),
    ]);
    const inject = `<script>window.FeelimeNative = window.parent.__FeelimePreviewBridge;<\/script>`;
    // Replacement MUST be a function: keyboard.js contains "$'" (currency
    // glyphs), and String.replace would expand $-sequences in a string
    // replacement, corrupting the inlined script.
    const patched = html
        .replace('<link rel="stylesheet" href="keyboard.css">', () => `<style>${css}</style>`)
        // The escaped <\/script> in the LITERAL below matters: a plain
        // closing tag inside a string would terminate THIS page's script
        // block at HTML parse time (self-inflicted).
        .replace('<script src="keyboard.js"><\/script>',
            () => `${inject}<script>${js}<\/script>`)
        .replace('</head>', () => `<style>
/* preview shell: 模拟原生侧的 IME 视图 —— 键盘贴底、上方是「宿主编辑器」；
   视图总高与 FeelimeService.FixedHeightInputView 同语义（默认 272dp、
   横屏 ≤ 屏高 1/2），拖动调节后由桥 setKeyboardHeight 改写。 */
html, body { background: #c7c9cf; }
#hostEditor {
    position: absolute; left: 0; right: 0; top: 0;
    min-height: 64px; max-height: 45%;
    overflow-y: auto; box-sizing: border-box;
    padding: 10px 12px 14px;
    background: #ffffff; color: #222;
    font: 15px/1.5 system-ui, sans-serif;
    box-shadow: 0 1px 4px #0003;
    word-break: break-all;
}
.host-raw { color: #23c890; text-decoration: underline; }
.host-caret { display: inline-block; width: 2px; height: 1.1em;
    background: #333; vertical-align: text-bottom; margin: 0 1px; }
#softKeyboard { position: absolute; left: 0; right: 0; bottom: 0; }
</style></head>`);
    if (patched === html) throw new Error('index.html 结构变化：内联替换未命中');
    frame.srcdoc = patched;
    frame.addEventListener('load', () => {
        // 宿主编辑器 DOM 注入（body 顶部）。
        const doc = frame.contentDocument;
        if (doc && doc.body && !doc.getElementById('hostEditor')) {
            const host = doc.createElement('div');
            host.id = 'hostEditor';
            host.innerHTML = '<span style="color:#98a">（模拟宿主 app 的输入框，输入内容会落在这里）</span>';
            doc.body.insertBefore(host, doc.body.firstChild);
        }
        applyDefaultKbHeight();
        // 视图高度刚被 JS 改写（native 侧是首次 layout 就绪），行高必须
        // 按最终高度重算一遍。
        setTimeout(pushEngineRefresh, 30);
        pushHello();
        // 版本号从 VERSION 文件读（body 正则会抓到无关的 3.x.x，误导过）。
        // 与 fetchFirst 相同的双布局回退：仓库 http server 或部署目录。
        const prefetch = document.getElementById('prefetch');
        (async () => {
            for (const root of ['../app/src/main/assets/keyboard/', 'kb-preview-src/']) {
                const r = await fetch(root + 'VERSION?v=' + Date.now(), { cache: 'no-store' });
                if (r.ok) {
                    prefetch.textContent = '已加载真实键盘（keyboard.js ' + (await r.text()).trim() + '）';
                    return;
                }
            }
            prefetch.textContent = '已加载真实键盘（kb-preview-src）';
        })();
    });
}

function applyDefaultKbHeight() {
    const doc = frame.contentDocument;
    const kb = doc && doc.getElementById('softKeyboard');
    if (!kb) return;

function renderChecklist() {
    const saved = JSON.parse(localStorage.getItem('feelime_preview_check') || '[]');
    const list = document.getElementById('checkList');
    list.replaceChildren();
    CHECK_ITEMS.forEach((label, i) => {
        const state = saved[i] || { v: '', note: '' };
        const row = document.createElement('div');
        row.className = 'check-item' + (state.v === 'bad' ? ' bad' : '');
        const ok = document.createElement('button');
        ok.textContent = '✓';
        ok.className = state.v === 'ok' ? 'ok' : '';

        bad.textContent = '✗';

            persist(); renderChecklist();

        note.onchange = persist;
        row.append(ok, bad, label_, note);
        list.append(row);

/* ---- URL 直达状态（截图/评审入口）----
 * ?act=qs                快捷设置首页（tile 网格）
 * ?act=qs&page=2         第二页
 * ?act=t9                T9 键面
 * ?act=t9popup           T9 长按三行弹层（按住 5 键的瞬间）
 * ?act=t9track           相对跟手：手往左滑，高亮滑到数字左边的符号
 * ?act=t9cancel          虚拟光标滑出卡片：缩小变淡 + 「松手撤销」
 * ?act=handwriting       手写键面（canvas 书写 + 模拟识别候选）
 * 可叠加 &theme=light / &locale=en。 */
(() => {
    const params = new URLSearchParams(location.search);
    const act = params.get('act');
    if (!act) return;
    const theme = params.get('theme');
    const locale = params.get('locale');
    if (theme) document.getElementById('previewTheme').value = theme;
    if (locale) document.getElementById('previewLocale').value = locale;
    if (params.get('mode') === 'landscape') setMode('landscape');
    const touch = (win, el, type, x, y) => el.dispatchEvent(new win.TouchEvent(type, {
        bubbles: true, cancelable: true,
        touches: [new win.Touch({ identifier: 1, target: el, clientX: x, clientY: y })],
        changedTouches: [new win.Touch({ identifier: 1, target: el, clientX: x, clientY: y })],
    }));
    setTimeout(() => {
        const win = frame.contentWindow;
        if (!win || !win.Feelime) return;
        if (theme || locale) pushHello();
        if (act === 'qs') {
            win.Feelime.toggleSettingsPanel();
            const page = Number(params.get('page')) || 1;
            if (page > 1) {
                setTimeout(() => {
                    const strip = frame.contentDocument.querySelector('.qs-pages');
                    if (strip && strip.firstElementChild) {
                        strip.scrollLeft = strip.firstElementChild.offsetWidth * (page - 1);
                    }
                }, 120);
            }
        } else if (act === 't9' || act === 't9popup' || act === 't9cancel' || act === 't9track') {
            document.getElementById('actT9').click();
        } else if (act === 'handwriting') {
            document.getElementById('actHandwriting').click();
        }
        if (act === 't9popup' || act === 't9cancel' || act === 't9track') {
            // 按住 5 键到长按阈值，弹层出现；（t9cancel）再滑出取消圈；
            // （t9track）手指停在键与浮层之间——高亮应已投影跟手。
            setTimeout(() => {
                const doc = frame.contentDocument;
                const key = doc.querySelector('.t9-key[data-key="5"]');
                if (!key) return;
                const rect = key.getBoundingClientRect();
                touch(win, key, 'touchstart', rect.left + rect.width / 2, rect.top + rect.height / 2);
                if (act === 't9cancel') {
                    setTimeout(() => {
                        touch(win, key, 'touchmove', 10, rect.top - 260);
                    }, 520);
                } else if (act === 't9track') {
                    // 手往左滑（手指全程在键附近）→ 高亮应滑到左符号、
                    setTimeout(() => {
                        touch(win, key, 'touchmove', rect.left - 34,
                              rect.top + rect.height / 2);
                    }, 520);
                }
            }, 400);
        }
    }, 700);
})();
</script>
</body>
</html>
