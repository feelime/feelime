<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>Feelime Keyboard</title>
    <link rel="stylesheet" href="keyboard.css">
</head>
<body>
<main id="softKeyboard" aria-label="Feelime HTML keyboard">
    <!-- 背景图片层：铺满整个键盘区域（工具条到底部留白）。z-index 垫底，
         data-bg-image=on 时根背景转透明让图透出。 -->
    <div id="bgImage" aria-hidden="true"></div>
    <!-- 拼音行内前缀：悬浮在顶部 padding 带里（issue #8 定稿形态——
         独立一行，字号可在设置里三档调整）。 -->
    <div id="preeditLine" aria-live="polite"></div>

    <!-- 单手模式侧边条（issue #15）：data-side-content 驱动两态——
         cursor（2×4 光标/编辑簇）、blank。位置贴单手让位的一侧。 -->
    <aside id="sidePad">
        <div id="sideGrid">
            <!-- 方向键按物理位次排布（issue #15 定稿）：上 / 左右 / 下，
                 与手指预期一致；编辑键横排 icon+文字保证语义明确。 -->
            <div class="side-row">
                <button class="side-key" data-side-cursor="up" aria-label="光标上移" data-i18n-aria-label="光标上移">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 15 L12 8 L19 15"/>
                    </svg>
                </button>
            </div>
            <div class="side-row side-row-mid">
                <button class="side-key" data-side-cursor="left" aria-label="光标左移" data-i18n-aria-label="光标左移">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M15 5 L8 12 L15 19"/>
                    </svg>
                </button>
                <button class="side-key" data-side-cursor="right" aria-label="光标右移" data-i18n-aria-label="光标右移">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 5 L16 12 L9 19"/>
                    </svg>
                </button>
            </div>
            <div class="side-row">
                <button class="side-key" data-side-cursor="down" aria-label="光标下移" data-i18n-aria-label="光标下移">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 9 L12 16 L19 9"/>
                    </svg>
                </button>
            </div>
            <button class="side-key side-labeled" data-side-action="selectAll" aria-label="全选" data-i18n-aria-label="全选">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <path d="M7 3H5a2 2 0 0 0-2 2v2m0 4v2m0 4v2a2 2 0 0 0 2 2h2m4 0h2m4 0h2a2 2 0 0 0 2-2v-2m0-4v-2m0-4V5a2 2 0 0 0-2-2h-2M9 9h6v6H9z"/>
                </svg>
                <span data-i18n="全选">全选</span>
            </button>
            <button class="side-key side-labeled" data-side-action="copy" aria-label="复制" data-i18n-aria-label="复制">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/>
                </svg>
                <span data-i18n="复制">复制</span>
            </button>
            <button class="side-key side-labeled" data-side-action="cut" aria-label="剪切" data-i18n-aria-label="剪切">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
                    <path d="M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"/>
                </svg>
                <span data-i18n="剪切">剪切</span>
            </button>
            <button class="side-key side-labeled" data-side-action="paste" aria-label="粘贴" data-i18n-aria-label="粘贴">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/>
                </svg>
                <span data-i18n="粘贴">粘贴</span>
            </button>
        </div>
    </aside>

<!-- Editor strip ABOVE the candidate bar
         (which stays selectable mid-edit), regular keyboard below. -->
    <section id="panelEditor" hidden>
        <input id="panelEditorInput" class="phrase-input" maxlength="200"
               placeholder="输入常用内容（最多 200 字）" data-i18n-placeholder="输入常用内容（最多 200 字）" aria-label="常用语内容" data-i18n-aria-label="常用语内容">
 <!-- The custom-JSON editor shares the strip as a
             multi-line textarea (system paste works on real inputs). -->
        <textarea id="panelEditorArea" class="phrase-input phrase-area" rows="3" hidden
                  placeholder="粘贴定制 JSON" data-i18n-placeholder="粘贴定制 JSON" aria-label="定制键盘 JSON" data-i18n-aria-label="定制键盘 JSON"></textarea>
        <button id="panelEditorCancel" class="phrase-cancel" aria-label="取消" data-i18n-aria-label="取消" data-i18n="取消">取消</button>
        <button id="panelEditorSave" class="phrase-add" aria-label="保存" data-i18n-aria-label="保存" data-i18n="保存">保存</button>
    </section>
 <!-- The phrase editor card floats ABOVE the keyboard view
         (native band area): title row + 2-row input + input
         code + save/cancel. The redirect channel targets .phrase-input
         focus, which the card's textarea keeps. -->
    <section id="phraseCard" hidden>
        <div class="pc-head">
            <button id="phraseCardClose" class="pc-close" aria-label="关闭" data-i18n-aria-label="关闭">×</button>
            <span id="phraseCardTitle" class="pc-title" data-i18n="添加常用语">添加常用语</span>
            <span class="pc-head-pad" aria-hidden="true"></span>
        </div>
        <div class="pc-card">
            <textarea id="phraseCardInput" class="phrase-input pc-input" rows="2" maxlength="200"
                      placeholder="输入常用内容" data-i18n-placeholder="输入常用内容" aria-label="常用语内容" data-i18n-aria-label="常用语内容"></textarea>
            <!-- issue #19：编辑常用语时从最近剪贴板取内容（取最新一条，
                 超 200 字截断）。 -->
            <button id="phraseCardPaste" class="pc-paste-btn" type="button"
                    aria-label="从剪贴板粘贴" data-i18n-aria-label="从剪贴板粘贴"
                    data-i18n="从剪贴板粘贴">从剪贴板粘贴</button>
            <label class="pc-code-label" for="phraseCardCode"><span data-i18n="输入码">输入码</span> <small data-i18n="留空时自动生成">留空时自动生成</small></label>
            <!-- The code field shares one row with the rank stepper -
                 the code input narrows and the freed space holds 位次 -/+. -->
            <div class="pc-code-row">
                <input id="phraseCardCode" class="pc-code phrase-input" maxlength="12"
                       placeholder="例如：nh" data-i18n-placeholder="例如：nh" aria-label="输入码" data-i18n-aria-label="输入码">
                <span class="pc-rank" role="group" aria-label="位次" data-i18n-aria-label="位次">
                    <button id="phraseCardRankDown" class="pc-rank-btn" aria-label="位次减一" data-i18n-aria-label="位次减一">−</button>
                    <span id="phraseCardRankValue" class="pc-rank-value">1</span>
                    <button id="phraseCardRankUp" class="pc-rank-btn" aria-label="位次加一" data-i18n-aria-label="位次加一">＋</button>
                    <span class="pc-rank-label" data-i18n="位次">位次</span>
                </span>
            </div>
            <div class="pc-actions">
                <button id="phraseCardCancel" class="pc-btn pc-ghost" aria-label="取消" data-i18n-aria-label="取消" data-i18n="取消">取消</button>
                <button id="phraseCardSave" class="pc-btn pc-main" aria-label="保存" data-i18n-aria-label="保存" data-i18n="保存">保存</button>
            </div>
        </div>
    </section>
 <!-- Height adjust card (floats above the keyboard view).
         Fine steps via the -/+ buttons (applied live), coarse via the drag
         strip (preview only - the height lands on release/保存). -->
    <section id="heightCard" hidden>
        <div class="pc-head">
            <span class="pc-head-pad" aria-hidden="true"></span>
            <span class="pc-title" data-i18n="键盘高度">键盘高度</span>
            <span class="pc-head-pad" aria-hidden="true"></span>
        </div>
        <div class="pc-card">
            <div class="hc-row">
                <button id="heightMinus" class="hc-step" aria-label="减少高度" data-i18n-aria-label="减少高度">−</button>
                <div id="heightTrack" class="hc-track">
                    <i id="heightThumb"></i>
                </div>
                <button id="heightPlus" class="hc-step" aria-label="增加高度" data-i18n-aria-label="增加高度">＋</button>
            </div>
            <div class="hc-meta">
                <span id="heightValue">272</span>
                <span class="hc-hint" id="heightHint" data-i18n="拖动为预览，松手应用">拖动为预览，松手应用</span>
            </div>
            <div class="pc-actions">
                <button id="heightCardReset" class="pc-btn pc-ghost" aria-label="恢复默认" data-i18n-aria-label="恢复默认" data-i18n="恢复默认">恢复默认</button>
                <button id="heightCardCancel" class="pc-btn pc-ghost" aria-label="取消" data-i18n-aria-label="取消" data-i18n="取消">取消</button>
                <button id="heightCardSave" class="pc-btn pc-main" aria-label="保存" data-i18n-aria-label="保存" data-i18n="保存">保存</button>
            </div>
        </div>
    </section>
    <section id="candidateBar">
 <!-- The app's own F logo marks the keyboard menu;
             the gear moved to the full-settings entry. -->
        <button id="setupButton" data-role="setup" class="tool" aria-label="键盘设置" data-i18n-aria-label="键盘设置">
 <!-- The refreshed F logo (docs/branding/feelime-logo.svg,
                 same path as app/src/main/res/drawable/ic_launcher.xml). -->
            <svg viewBox="0 0 48 48" width="16" height="16" fill="currentColor" aria-hidden="true">
                <path d="M12.5 8.5h24l-1.8 6.2H19.3v7.2h13.3l-1.8 6.2H19.3v11.4h-6.8z"/>
                <rect x="31" y="31" width="4.5" height="8.5" rx="1"/>
            </svg>
        </button>
 <!-- The control-key entry - the toolbar swaps for two
             rows of control keys (Esc/Ctrl/Alt/arrows/...) while it shows. -->
        <button id="ctrlTool" data-role="ctrl-tool" class="tool" aria-label="控制键" data-i18n-aria-label="控制键">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="1.8" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2"/>
                <path d="M7 9l4 3-4 3M13 15h4"/>
            </svg>
        </button>
 <!-- Opens the SYSTEM input method picker (all IMEs). -->
        <button id="imeSwitchButton" data-role="ime-switch" class="tool" aria-label="切换输入法" data-i18n-aria-label="切换输入法">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                 stroke-width="1.6" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/>
                <path d="M3 12h18M12 3c3 3.5 3 14 0 18M12 3c-3 3.5-3 14 0 18"/>
            </svg>
        </button>
 <!-- Full settings moved off the panel into the toolbar;
             only visible while the quick panel is open. A gear
             glyph - the toolbar's own entry is the app logo now, so the gear
             no longer reads as a duplicate. The ‹ › pager buttons are gone
 the bar holds the whole pool and auto-fetches. -->
        <button id="fullSetupButton" class="tool" aria-label="打开完整设置" data-i18n-aria-label="打开完整设置" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
        </button>
        <div id="candidates"></div>
 <!-- Engine lifecycle notice (mode-fallback §2.3): overlays the
             candidate strip while the engine warms up or a degrade fallback
             serves. Pointer-transparent; hidden otherwise. -->
        <div id="engineStatus" hidden></div>
        <button id="clipboardButton" data-role="clipboard" class="tool" aria-label="剪贴板" data-i18n-aria-label="剪贴板">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                <path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/>
            </svg>
        </button>
        <button id="favoritesButton" data-role="favorites" class="tool" aria-label="常用语" data-i18n-aria-label="常用语">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                <path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
            </svg>
        </button>
        <button id="composeClear" class="tool compose-tool" aria-label="清除输入" data-i18n-aria-label="清除输入" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
        </button>
        <button id="composeExpand" class="tool compose-tool" aria-label="展开候选" data-i18n-aria-label="展开候选" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                <path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
            </svg>
        </button>
        <button id="mic" class="tool" aria-label="开始语音输入" data-i18n-aria-label="开始语音输入">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
                <path d="M19 12a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-2.06A9 9 0 0 0 21 12h-2z"/>
            </svg>
        </button>
        <button id="hide" class="tool" aria-label="收起键盘" data-i18n-aria-label="收起键盘">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                <path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/>
            </svg>
        </button>
 <!-- Settings sub-page chrome rides the toolbar -
             left: back + title, right: close. Regular tools hide meanwhile. -->
        <div id="settingsPageBar" hidden></div>
    </section>

    <section id="expandLayer" hidden>
        <div class="expand-head">
            <div class="expand-tabs" role="tablist">
                <button class="expand-tab active" data-expand-tab="freq" data-i18n="词频">词频</button>
                <button class="expand-tab" data-expand-tab="single" data-i18n="单字">单字</button>
            </div>
            <div id="expandPreedit" aria-live="polite"></div>
            <button id="expandCollapse" class="tool" aria-label="收起候选" data-i18n-aria-label="收起候选">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                    <path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6z"/>
                </svg>
            </button>
        </div>
        <div class="expand-body">
            <div id="expandVariants"></div>
            <div id="expandGrid"></div>
        </div>
    </section>

 <!-- The control-key view replaces ONLY the candidate
         bar (same 40px slot); the keyboard rows below stay untouched. -->
    <section id="ctrlLayer" class="kb-layer" hidden>
        <div class="kb-row ctrl-row">
            <button class="kb-key ctrl-key" data-ctrl="Escape">Esc</button>
            <button class="kb-key ctrl-key ctrl-mod" data-ctrl="sticky-ctrl">Ctrl</button>
            <button class="kb-key ctrl-key" data-ctrl="Home">Home</button>
            <button class="kb-key ctrl-key" data-ctrl="ArrowUp">↑</button>
            <button class="kb-key ctrl-key" data-ctrl="End">End</button>
            <button class="kb-key ctrl-key" data-ctrl="PageUp">PgUp</button>
 <!-- Fn replaces the Comb icon - tap = sticky
                 (twelve letter keys become F1..F12), long-press = the old
                 Comb combo grid. -->
            <button class="kb-key ctrl-key ctrl-mod" data-ctrl="sticky-fn" aria-label="Fn 粘滞键" data-i18n-aria-label="Fn 粘滞键">Fn</button>
            <button class="kb-key ctrl-key" data-ctrl="Del">Del</button>
        </div>
        <div class="kb-row ctrl-row">
            <button class="kb-key ctrl-key" data-ctrl="Tab">Tab</button>
            <button class="kb-key ctrl-key ctrl-mod" data-ctrl="sticky-alt">Alt</button>
            <button class="kb-key ctrl-key" data-ctrl="ArrowLeft">←</button>
            <button class="kb-key ctrl-key" data-ctrl="ArrowDown">↓</button>
            <button class="kb-key ctrl-key" data-ctrl="ArrowRight">→</button>
            <button class="kb-key ctrl-key" data-ctrl="PageDown">PgDn</button>
            <button class="kb-key ctrl-key ctrl-mod" data-ctrl="sticky-meta" aria-label="Meta 键" data-i18n-aria-label="Meta 键">&#8862;</button>
            <button class="kb-key ctrl-key ctrl-close" data-ctrl="collapse" aria-label="收起控制键" data-i18n-aria-label="收起控制键">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor"
                     stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                    <path d="M6 6 L18 18 M18 6 L6 18"/>
                </svg>
            </button>
        </div>
    </section>

    <!-- 工具栏编辑模式（issue #15）：替换键区，展示未上栏的 icon 仓库
         （点按添加到工具栏；候选条内 × 移除、长按拖动排序）。 -->
    <section id="toolbarEditor" hidden>
        <div class="tbe-head">
            <span class="tbe-title" data-i18n="编辑工具栏">编辑工具栏</span>
            <span class="tbe-hint" data-i18n="点按图标添加 · 拖动工具栏图标排序">点按图标添加 · 拖动工具栏图标排序</span>
            <button id="toolbarEditCancel" class="tbe-cancel" data-i18n="取消">取消</button>
            <button id="toolbarEditDone" class="tbe-done" data-i18n="完成">完成</button>
        </div>
        <div id="toolbarEditorGrid"></div>
    </section>

    <section id="qwertyLayer" class="kb-layer"></section>
    <section id="symbolLayer" class="kb-layer" hidden>
        <div id="symGrid"></div>
        <div id="symCatBar">
            <button class="kb-key kb-special" data-action="letters">ABC</button>
            <div id="symCats"></div>
            <button class="kb-key kb-special" id="symEnterKey" aria-label="换行" data-i18n-aria-label="换行" data-i18n="换行">换行</button>
        </div>
    </section>
    <!-- 九宫格数字键盘（长按 123 打开），全部由 renderNumpad 填充 -->
    <section id="numPadLayer" class="kb-layer" hidden></section>

    <section id="panelLayer" hidden>
        <div class="panel-head">
            <button id="panelClose" class="tool" aria-label="关闭面板" data-i18n-aria-label="关闭面板">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                    <path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/>
                </svg>
            </button>
            <div class="panel-tabs" role="tablist">
                <button class="panel-tab active" data-panel-tab="clipboard" data-i18n="剪贴板">剪贴板</button>
                <button class="panel-tab" data-panel-tab="favorites" data-i18n="常用语">常用语</button>
            </div>
            <button id="panelClear" class="panel-action" aria-label="清空剪贴板" data-i18n-aria-label="清空剪贴板" data-i18n="清空">清空</button>
            <button id="panelManage" class="panel-action" aria-label="添加常用语" data-i18n-aria-label="添加常用语" hidden data-i18n="＋添加">＋添加</button>
        </div>
        <div id="panelList"></div>
        <div id="panelEmpty" hidden></div>
    </section>


    <div id="modeMenu"></div>

 <!-- Long-press / ⋯ menu for a favorites row. -->
    <div id="itemMenu"></div>

 <!-- Confirm deleting a self-made word from the user
         lexicon (long-press a candidate -> 删除自造词). -->
    <div id="confirmCard" hidden>
        <div id="confirmText" aria-live="polite"></div>
        <div class="confirm-actions">
            <button id="confirmCancel" data-i18n="取消">取消</button>
            <button id="confirmOk" class="danger" data-i18n="删除">删除</button>
        </div>
    </div>

    <section id="settingsPanel" hidden>
 <!-- The toolbar tools live in the quick panel now (the
             toolbar keeps only the logo, the gear and the dismiss chevron).
             renderSettingsHome re-appends this node after each rebuild, so
             the ids/bindings the suites (and users) rely on survive. -->
    </section>

    <div id="voiceOverlay">
        <div id="voiceScrim"></div>
        <div id="voiceCard">
 <!-- The big red dot became a half-height mic icon
                 (portrait AND landscape); only colours/pulse animate. -->
            <div class="vc-mic">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                    <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
                    <path d="M19 12a7 7 0 0 1-14 0H3a9 9 0 0 0 8 8.94V23h2v-2.06A9 9 0 0 0 21 12h-2z"/>
                </svg>
            </div>
            <div id="voiceStatus" data-i18n="正在聆听…">正在聆听…</div>
            <div id="partialText" aria-live="polite"></div>
            <div id="levelBar"><i></i></div>
            <div id="voiceHint" data-i18n="点击任意位置结束">点击任意位置结束</div>
            <!-- mic 浮层动作行：说完了居中大按钮（主要出口）。 -->
            <div id="voiceActions">
                <button id="voiceDone" type="button" aria-label="说完了，结束并上屏" data-i18n-aria-label="说完了，结束并上屏">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
                        <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
                    </svg><span data-i18n="说完了">说完了</span>
                </button>
            </div>
            <!-- 撤销（弃稿）回右上角：小而语义明确（↺+文字）。 -->
            <button id="voiceClose" type="button" aria-label="撤销本次听写" data-i18n-aria-label="撤销本次听写">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true">
                    <path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
                </svg><span id="voiceCloseLabel" data-i18n="撤销">撤销</span>
            </button>
        </div>
        <!-- 长按空格浮层专用：上滑撤销提示，toast 样式挂在卡片下方，
             不自动消失；上滑时字体和背景同步放大（updateSlideCancel）。 -->
        <div id="voiceSlideHint" data-i18n="上滑撤销">上滑撤销</div>
    </div>

    <div id="keyPopup"><div id="keyPopupInner"></div></div>
    <!-- 三行弹层滑出卡片边界时的「松手撤销」提示（issue #9，showPopupCancelTip） -->
    <div id="keyPopupCancelTip"></div>
 <!-- The 3x3 combo grid (long-press Ctrl/Alt/tap Comb) - full
         key names stacked per row, centered. -->
    <div id="comboPopup"><button id="comboClose" aria-label="关闭组合键浮层" data-i18n-aria-label="关闭组合键浮层">×</button><div id="comboPopupInner"></div></div>
 <!-- The keyboard-height adjust handle (drag the top edge),
         shown only from quick settings. -->
    <div id="flickBlob"></div>
    <div id="toast" role="status"></div>
</main>
<script src="keyboard.js"></script>
</body>
</html>
